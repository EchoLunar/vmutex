name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        run: |
          set -euo pipefail
          script_version=$(sed -n 's/^readonly VMUTEX_VERSION="\([0-9][0-9.]*\)"$/\1/p' vmutex)
          test "$GITHUB_REF_NAME" = "v$script_version"
      - name: Validate scripts
        run: |
          bash -n vmutex install.sh tests/test.sh
          bash tests/test.sh
          shellcheck vmutex install.sh tests/test.sh
      - name: Build release assets
        run: |
          chmod 0755 vmutex install.sh
          sha256sum vmutex > vmutex.sha256
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vmutex vmutex.sha256 install.sh --generate-notes --verify-tag
